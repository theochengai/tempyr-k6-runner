name: Runner CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check runner syntax
        run: |
          node --check runner/run.mjs
          node --check runner/tempyr-run.mjs
          node --check runner/k6-scenario-script-renderer.mjs
          node --check runner/run-time-series.mjs

      - name: Run runner contract tests
        run: node --test test/*.test.mjs
