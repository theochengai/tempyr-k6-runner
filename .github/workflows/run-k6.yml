name: Run k6
run-name: "Tempyr ${{ inputs.run_id || 'manual smoke' }}"

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Tempyr Run ID for automatic execution
        required: false
        default: ""
        type: string
      execution_token:
        description: Short-lived Tempyr execution credential
        required: false
        default: ""
        type: string
      target_url:
        description: Public HTTP(S) endpoint for manual smoke testing
        required: false
        default: https://quickpizza.grafana.com/api/get
        type: string

permissions:
  contents: read

jobs:
  k6:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Checkout runner
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run QuickPizza smoke test
        if: ${{ inputs.run_id == '' }}
        env:
          PERF_TARGET_URL: ${{ inputs.target_url }}
        run: node runner/run.mjs

      - name: Validate Tempyr dispatch inputs
        if: ${{ inputs.run_id != '' }}
        env:
          TEMPYR_EXECUTION_TOKEN: ${{ inputs.execution_token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${TEMPYR_EXECUTION_TOKEN}" ]; then
            echo "Tempyr execution token is required for automatic execution" >&2
            exit 1
          fi
          echo "::add-mask::${TEMPYR_EXECUTION_TOKEN}"

      - name: Execute Tempyr run
        if: ${{ inputs.run_id != '' }}
        env:
          TEMPYR_API_BASE: https://tempyr.perftest.workers.dev
          TEMPYR_EXECUTION_TOKEN: ${{ inputs.execution_token }}
          TEMPYR_RUN_ID: ${{ inputs.run_id }}
        run: node runner/tempyr-run.mjs

      - name: Report Tempyr provider failure
        if: ${{ failure() && inputs.run_id != '' }}
        continue-on-error: true
        env:
          TEMPYR_API_BASE: https://tempyr.perftest.workers.dev
          TEMPYR_EXECUTION_TOKEN: ${{ inputs.execution_token }}
          TEMPYR_RUN_ID: ${{ inputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${TEMPYR_EXECUTION_TOKEN}" ]; then
            exit 0
          fi
          echo "::add-mask::${TEMPYR_EXECUTION_TOKEN}"
          API_BASE="${TEMPYR_API_BASE%/}/api/v1"
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors \
            -X POST \
            -H "Authorization: Bearer ${TEMPYR_EXECUTION_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"summary":"GitHub Actions execution provider failed before successful completion"}' \
            "${API_BASE}/internal/execution-jobs/${TEMPYR_RUN_ID}/provider-failed"
