name: Run k6
run-name: "PerfTest ${{ inputs.run_id || 'manual smoke' }}"

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: PerfTest Run ID for automatic execution
        required: false
        default: ""
        type: string
      target_url:
        description: Public HTTP(S) endpoint for manual smoke testing
        required: false
        default: https://quickpizza.grafana.com/api/get
        type: string

permissions:
  contents: read

jobs:
  k6:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Checkout public smoke runner
        if: ${{ inputs.run_id == '' }}
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run QuickPizza smoke test
        if: ${{ inputs.run_id == '' }}
        env:
          PERF_TARGET_URL: ${{ inputs.target_url }}
        run: node runner/run.mjs

      - name: Checkout PerfTest execution source
        if: ${{ inputs.run_id != '' }}
        uses: actions/checkout@v4
        with:
          repository: theochengai/perftest_poc
          ref: main
          token: ${{ secrets.PERFTEST_SOURCE_TOKEN }}
          persist-credentials: false
          path: perftest-src

      - name: Execute PerfTest run
        if: ${{ inputs.run_id != '' }}
        working-directory: perftest-src
        env:
          PERF_CLOUDFLARE_API_BASE: https://tempyr.perftest.workers.dev
          PERF_RUNNER_TOKEN: ${{ secrets.PERF_RUNNER_TOKEN }}
          PERF_RUN_ID: ${{ inputs.run_id }}
        run: node runner/cloudflare-k6-runner.mjs --run-id "$PERF_RUN_ID"

      - name: Report PerfTest provider failure
        if: ${{ failure() && inputs.run_id != '' }}
        continue-on-error: true
        env:
          PERF_CLOUDFLARE_API_BASE: https://tempyr.perftest.workers.dev
          PERF_RUNNER_TOKEN: ${{ secrets.PERF_RUNNER_TOKEN }}
          PERF_RUN_ID: ${{ inputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          API_BASE="${PERF_CLOUDFLARE_API_BASE%/}/api/v1"
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors \
            -X POST \
            -H "Authorization: Bearer ${PERF_RUNNER_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"summary":"GitHub Actions execution provider failed before successful completion"}' \
            "${API_BASE}/internal/execution-jobs/${PERF_RUN_ID}/provider-failed"
