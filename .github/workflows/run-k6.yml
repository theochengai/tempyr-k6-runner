name: Run k6

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Public HTTP(S) endpoint to smoke test
        required: true
        default: https://quickpizza.grafana.com/api/get
        type: string

permissions:
  contents: read

jobs:
  k6:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout runner
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run smoke test
        env:
          PERF_TARGET_URL: ${{ inputs.target_url }}
        run: node runner/run.mjs
